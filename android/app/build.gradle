apply plugin: 'com.android.application'

def normalizedEpochValue = rootProject.ext.getReproducibleSourceDateEpoch(project)
def buildMode = (project.findProperty('buildMode') ?: 'nongithub').toString()
if (!(buildMode in ['github', 'nongithub'])) {
    throw new GradleException("buildMode must be github or nongithub")
}
def signingRequested = project.findProperty('signRelease') == 'true'

android {
    namespace = "org.muslimtechnician.muajjin"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = "36.0.0"

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "org.muslimtechnician.muajjin"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 300
        versionName "2.9.82"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        buildConfigField(
                "long",
                "BUILD_TIMESTAMP",
                "${normalizedEpochValue}L"
        )
    }

    // Release assembly is unsigned unless signing is explicitly requested.
    // Never consume a developer's keystore just because local.properties exists.
    if (signingRequested) {
        def keystorePropertiesFile = rootProject.file("local.properties")
        def keystoreProperties = new Properties()
        if (keystorePropertiesFile.exists()) {
            keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
        }
        ['keystore.file', 'keystore.password', 'keystore.key.alias', 'keystore.key.password'].each { key ->
            if (!keystoreProperties[key]) {
                throw new GradleException("Explicit release signing requires ${key} in local.properties")
            }
        }
        signingConfigs {
            release {
                storeFile file(keystoreProperties['keystore.file'])
                storePassword keystoreProperties['keystore.password']
                keyAlias keystoreProperties['keystore.key.alias']
                keyPassword keystoreProperties['keystore.key.password']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingRequested) {
                signingConfig signingConfigs.release
            }
        }
    }

    // APK splits for smaller download sizes
    // Only enable if uploading to Google Play Store (comment out for direct APK distribution)
    // splits {
    //     abi {
    //         enable true
    //         reset()
    //         include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
    //         universalApk false
    //     }
    // }

    // Enable language configuration for smaller APK (if only supporting one language)
    // Only needed if your app doesn't need multiple languages
    // // Uncomment to only bundle English
    // resourceConfigurations += ['en']

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def signatureSuffix = variant.buildType.name == 'release' && !signingRequested ? '-unsigned' : ''
            outputFileName = "muajjin-${variant.versionName}-${variant.versionCode}-${buildMode}-${variant.name}${signatureSuffix}.apk"
        }
    }
}

// Reject an APK/AAB labelled for another distribution or source epoch.
// Pure native unit tests do not require web assets; only packaging does.
def validateBundledWebInputs = tasks.register('validateBundledWebInputs') {
    doLast {
        def manifest = file('src/main/assets/public/build-info.json')
        if (!manifest.isFile()) {
            throw new GradleException('Build web assets and Capacitor sync before Android packaging')
        }
        def inputs = new groovy.json.JsonSlurper().parse(manifest)
        if (inputs.mode != buildMode) {
            throw new GradleException("Bundled web mode ${inputs.mode} does not match Android ${buildMode}")
        }
        if (inputs.sourceDateEpoch.toString() != normalizedEpochValue.toString()) {
            throw new GradleException('Bundled web source epoch does not match Android sourceDateEpoch')
        }
    }
}
tasks.configureEach {
    if (name in ['packageDebug', 'packageRelease', 'bundleDebug', 'bundleRelease']) {
        dependsOn(validateBundledWebInputs)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
