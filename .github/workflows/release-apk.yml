name: Build unsigned release artifacts

# Tag builds and explicit manual requests produce CI artifacts only. There is
# no keystore access, signing, GitHub Release mutation, or automatic publishing.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref to build (tag or commit; no implicit latest release)'
        type: string
        required: true
        default: main
      source_date_epoch:
        description: 'Actual build epoch in seconds; empty means selected source commit timestamp'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/build-apk.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      full_native: true

  release:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [nongithub, github]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate selected source identity
        id: identity
        env:
          BUILD_MODE: ${{ matrix.mode }}
          REQUESTED_EPOCH: ${{ inputs.source_date_epoch }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [[ "$EVENT_NAME" == push && "$TAG_NAME" != "v$version" ]]; then
            echo 'Release tag must exactly match package/native version.' >&2
            exit 1
          fi
          epoch="${REQUESTED_EPOCH:-$(git show -s --format=%ct HEAD)}"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "name=$(python3 -B scripts/build-identity.py --mode "$BUILD_MODE" --variant release)" >> "$GITHUB_OUTPUT"
      - name: Controlled unsigned release assembly
        env:
          BUILD_MODE: ${{ matrix.mode }}
          BUILD_EPOCH: ${{ steps.identity.outputs.epoch }}
        run: bun run reproducible:build --install --mode "$BUILD_MODE" --time "$BUILD_EPOCH" --output "reproducible-output/$BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.name }}
          path: |
            reproducible-output/${{ matrix.mode }}/${{ steps.identity.outputs.name }}
            reproducible-output/${{ matrix.mode }}/build-metadata.txt
          if-no-files-found: error

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Muajjin ${{ github.ref_name }} (Enhanced Edition)"
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/build-metadata.txt
          draft: false
          prerelease: false
          body: |
            ### 🕌 Muajjin ${{ github.ref_name }} (Enhanced Edition)

            An enhanced, ultra-efficient, and truly offline-first Salat & Saum companion for Android and Web.

            #### 🌟 Highlights & Key Improvements
            - 🔄 **True Indefinite Offline Schedule Renewal:** Built-in native Java calculation engine (porting `adhan 4.4.3` and Umm al-Qura). Widgets and alarms recalculate indefinitely offline without ever needing to reopen the app.
            - ⚡ **Zero-Waste Battery & CPU Performance:** Replaced 1-second interval loops with an event-driven boundary clock scheduler. Background alarms automatically power down when no widgets or notifications are active.
            - 🎯 **Mathematical & Calculation Fixes:** Fixed equator/prime-meridian (`0,0`) coordinates bug, true astronomical next-day Fajr calculation, overnight Isha boundary precision, and isolated madhab parameters.
            - 💾 **Crash-Proof Asset Storage:** User-uploaded custom fonts (up to 5MB) moved from `localStorage` base64 strings into native binary IndexedDB storage with strict WOFF2 validation.
            - 📱 **Refined Widget Suite:** All 7 widget variants optimized, including a redesigned 3-column × 2-row large widget grid preventing text clipping in Arabic/RTL and compact screens.

