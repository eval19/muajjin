name: Build unsigned release artifacts

# Tag builds and explicit manual requests produce CI artifacts only. There is
# no keystore access, signing, GitHub Release mutation, or automatic publishing.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref to build (tag or commit; no implicit latest release)'
        type: string
        required: true
        default: main
      source_date_epoch:
        description: 'Actual build epoch in seconds; empty means selected source commit timestamp'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    needs: resolve
    uses: ./.github/workflows/build-apk.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      full_native: true

  release:
    needs: [resolve, quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [nongithub, github]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate selected source identity
        id: identity
        env:
          BUILD_MODE: ${{ matrix.mode }}
          REQUESTED_EPOCH: ${{ inputs.source_date_epoch }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [[ "$EVENT_NAME" == push && "$TAG_NAME" != "v$version" ]]; then
            echo 'Release tag must exactly match package/native version.' >&2
            exit 1
          fi
          epoch="${REQUESTED_EPOCH:-$(git show -s --format=%ct HEAD)}"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "name=$(python3 -B scripts/build-identity.py --mode "$BUILD_MODE" --variant release)" >> "$GITHUB_OUTPUT"
      - name: Controlled unsigned release assembly
        env:
          BUILD_MODE: ${{ matrix.mode }}
          BUILD_EPOCH: ${{ steps.identity.outputs.epoch }}
        run: bun run reproducible:build --install --mode "$BUILD_MODE" --time "$BUILD_EPOCH" --output "reproducible-output/$BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.name }}
          path: |
            reproducible-output/${{ matrix.mode }}/${{ steps.identity.outputs.name }}
            reproducible-output/${{ matrix.mode }}/build-metadata.txt
          if-no-files-found: error

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Muajjin ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/build-metadata.txt
          draft: false
          prerelease: false
          body: |
            ### Muajjin ${{ github.ref_name }}

            This release adds Android home screen widgets and improves offline reliability and battery usage.

            - Android home screen widgets in multiple sizes (strip, square, banner, wide, and full table)
            - Offline prayer calculation renewal so widgets keep updating without reopening the app
            - Reduced battery consumption by stopping background updates when no widgets are on screen
            - Fixed prayer time transitions, next Fajr calculation, and coordinate edge cases

