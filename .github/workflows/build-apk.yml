name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      full_native:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.surface.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Determine affected native surface
        id: surface
        env:
          FULL_NATIVE: ${{ inputs.full_native || github.event_name == 'workflow_dispatch' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE', '')
          full = os.environ['FULL_NATIVE'] == 'true' or not base or set(base) == {'0'}
          paths = [] if full else subprocess.check_output(['git', 'diff', '--name-only', base, os.environ['HEAD']], text=True).splitlines()
          native = full or any(path.startswith(('android/', 'native-geolocation-plugin/', 'src/', 'public/', 'tests/', 'scripts/', '.github/workflows/')) or path in ('package.json', 'bun.lock', '.bun-version', 'capacitor.config.ts', 'vite.config.ts', 'tailwind.config.ts') for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('native=' + str(native).lower() + '\n')
          PY

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [nongithub, github]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Declare build inputs
        id: version
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "version=$(bun -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:domain
      - name: Build selected distribution
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          if [[ "$BUILD_MODE" == github ]]; then bun run build:github; else bun run build; fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ steps.version.outputs.version }}-${{ matrix.mode }}
          path: dist/
          if-no-files-found: error

  native:
    needs: [changes, web]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [nongithub, github]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - name: Declare artifact identity and epoch
        id: identity
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "path=$(python3 -B scripts/build-identity.py --mode "$BUILD_MODE" --variant debug --path)" >> "$GITHUB_OUTPUT"
          echo "name=$(python3 -B scripts/build-identity.py --mode "$BUILD_MODE" --variant debug)" >> "$GITHUB_OUTPUT"
      - name: Build and sync selected web assets
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          if [[ "$BUILD_MODE" == github ]]; then bun run build:github; else bun run build; fi
          bun run sync:android
      - name: Native unit regressions and debug assembly
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: bash android/gradlew -p android testDebugUnitTest assembleDebug :app:assembleDebugAndroidTest -PbuildMode="$BUILD_MODE" -PsourceDateEpoch="$SOURCE_DATE_EPOCH" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.name }}
          path: ${{ steps.identity.outputs.path }}
          if-no-files-found: error
