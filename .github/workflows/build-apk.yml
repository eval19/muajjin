name: Build Debug APK with Widgets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build:github

      - name: Sync to Android (Capacitor)
        run: bunx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" release-output/Muajjin-v2.7.1-widgets.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: muajjin-widget-debug-apk
          path: release-output/Muajjin-v2.7.1-widgets.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.1-widgets
          name: "Muajjin v2.7.1 with Home Screen Widgets"
          body: |
            ### 🕌 Muajjin v2.7.1 - 4-Size Widget Suite & Fixed Palette
            - **4 Distinct Sizes (Sheet 1):** 2x1 Strip, 2x2 Square, 4x1 Banner, and 4x2 Wide Card with 6-chip schedule strip, plus the preserved Full Table.
            - **Fixed Dual Palette (Light & Dark):** High-contrast emerald/mint theme with instant system dark mode support.
            - **Warm State Alert (Sheet 2):** Turns amber during the final 15 minutes before prayer window closure.
            - **Live Hardware Chronometer:** Ticks every second with tabular fixed-width digits and zero battery drain.
            - **Direct APK:** Download `Muajjin-v2.7.1-widgets.apk` below and install directly on your Android phone.
          files: release-output/Muajjin-v2.7.1-widgets.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

