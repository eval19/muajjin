name: Deploy to GitHub Pages

# Publishing remains deliberately tied to a published release or a manual
# deployment request, never an ordinary validation push or pull request.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact source ref to deploy'
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/build-apk.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.ref }}
      full_native: true

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Declare deterministic build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      # Preserve the existing standard/no-update-checker Pages distribution.
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
